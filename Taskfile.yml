version: "3"

vars:
  BIN_DIR: "{{.TASKFILE_DIR}}/bin"
  LDFLAGS: '-X github.com/jacaudi/diyddns/internal/version.Version={{.VERSION | default "v0.0.0-dev"}} -X github.com/jacaudi/diyddns/internal/version.Commit={{.COMMIT | default ""}} -X github.com/jacaudi/diyddns/internal/version.Date={{.DATE | default ""}}'

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  build:
    desc: Build both binaries into ./bin/
    deps: [build:server, build:client]

  build:server:
    desc: Build diyddns-server into ./bin/
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/diyddns-server ./cmd/diyddns-server

  build:client:
    desc: Build diyddns-client into ./bin/
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/diyddns-client ./cmd/diyddns-client

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test ./... -race

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w .
      - go run golang.org/x/tools/cmd/goimports@latest -w .

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artefacts
    cmds:
      - rm -rf {{.BIN_DIR}} ui/dist docs/openapi/*.json

  migrate:new:
    desc: "Create a new SQL migration in migrations/ (Usage: task migrate:new -- <name>)"
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@latest -dir migrations create {{.CLI_ARGS}} sql

  db:backup:
    desc: Show how to safely back up the SQLite DB (wired programmatically in Plan 03+)
    cmds:
      # WAL-safe backup is a single VACUUM INTO. Until the server exposes this
      # via a subcommand (Plan 03), document the one-liner rather than ship a
      # brittle wrapper. Usage hint: task db:backup -- /var/lib/diyddns/diyddns.db backup.db
      - |
        echo "Safe SQLite backup (consistent under WAL) uses VACUUM INTO:"
        echo "  sqlite3 <src.db> \"VACUUM INTO '<out.db>'\""
        echo "The server will expose this programmatically in Plan 03+."
