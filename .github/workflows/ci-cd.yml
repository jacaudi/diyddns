---
# CI/CD Pipeline for DIYDDNS
# Runs linting, testing, semantic release, and multi-arch container builds
# for both diyddns-server and diyddns-client. Modeled on jacaudi/dras.
name: CI/CD

"on":
  push:
    branches: [main]
  workflow_dispatch:

# Only allow one release at a time - queue subsequent runs
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint:
    uses: jacaudi/github-actions/.github/workflows/component-lint.yml@v0.20.1
    permissions:
      contents: read
    with:
      yaml: true
      go: true
    secrets: inherit

  test:
    uses: jacaudi/github-actions/.github/workflows/component-test.yml@v0.20.1
    permissions:
      contents: read
    with:
      test-framework: go
      coverage: true
    secrets: inherit

  release:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: jacaudi/github-actions/.github/workflows/component-semantic-release.yml@v0.20.1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      use-github-app: true
      go: true
      goreleaser: true
      extra-plugins: '@semantic-release/changelog @semantic-release/git @semantic-release/exec'
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  # Derive major and major.minor from the released semver so the container
  # images get the full set of moving tags (v2, v2.3, v2.3.1).
  version-parts:
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
    steps:
      - id: parse
        env:
          VERSION: ${{ needs.release.outputs.new-release-version }}
        run: |
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

  # Build and push multi-arch container images. Two parallel jobs, one per
  # binary — same release version, same tag set, separate ghcr.io namespaces:
  #   ghcr.io/<repo>-server
  #   ghcr.io/<repo>-client
  container-server:
    needs: [release, version-parts]
    if: needs.release.outputs.new-release-published == 'true'
    uses: jacaudi/github-actions/.github/workflows/component-container-build.yml@v0.20.1
    permissions:
      contents: read
      packages: write
    with:
      registry: ghcr.io
      image-name: ${{ github.repository }}-server
      context: .
      file: packaging/docker/server.Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      version: ${{ needs.release.outputs.new-release-version-v }}
      tags: |
        ghcr.io/${{ github.repository }}-server:latest
        ghcr.io/${{ github.repository }}-server:${{ needs.release.outputs.new-release-version-v }}
        ghcr.io/${{ github.repository }}-server:v${{ needs.version-parts.outputs.minor }}
        ghcr.io/${{ github.repository }}-server:v${{ needs.version-parts.outputs.major }}
    secrets: inherit

  container-client:
    needs: [release, version-parts]
    if: needs.release.outputs.new-release-published == 'true'
    uses: jacaudi/github-actions/.github/workflows/component-container-build.yml@v0.20.1
    permissions:
      contents: read
      packages: write
    with:
      registry: ghcr.io
      image-name: ${{ github.repository }}-client
      context: .
      file: packaging/docker/client.Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      version: ${{ needs.release.outputs.new-release-version-v }}
      tags: |
        ghcr.io/${{ github.repository }}-client:latest
        ghcr.io/${{ github.repository }}-client:${{ needs.release.outputs.new-release-version-v }}
        ghcr.io/${{ github.repository }}-client:v${{ needs.version-parts.outputs.minor }}
        ghcr.io/${{ github.repository }}-client:v${{ needs.version-parts.outputs.major }}
    secrets: inherit

  pipeline-summary:
    if: always()
    needs: [lint, test, release, container-server, container-client]
    uses: jacaudi/github-actions/.github/workflows/component-pipeline-summary.yml@v0.20.1
    secrets: inherit
