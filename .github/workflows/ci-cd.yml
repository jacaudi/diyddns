# CI/CD Pipeline for DIYDDNS
# Runs on push to main: lint, test, manual approval, semantic-release,
# then container builds gated on whether a new release was published.
name: CI/CD

"on":
  push:
    branches: [main]
  workflow_dispatch:

# Only one release at a time - queue subsequent runs
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    uses: jacaudi/github-actions/.github/workflows/component-lint.yml@v0.20.1
    permissions:
      contents: read
    with:
      go: true
      go-version: '1.25'
      yaml: true
      json: true

  test:
    name: Test
    uses: jacaudi/github-actions/.github/workflows/component-test.yml@v0.20.1
    permissions:
      contents: read
    with:
      test-framework: 'go'
      go-version: '1.25'
      coverage: true
      coverage-threshold: 80
      test-packages: './...'
      test-args: '-race'

  release:
    name: Semantic Release
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: jacaudi/github-actions/.github/workflows/component-semantic-release.yml@v0.20.1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      use-github-app: true
      extra-plugins: '@semantic-release/changelog @semantic-release/git @semantic-release/exec'
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  container-server:
    name: Container - server
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true' && hashFiles('packaging/docker/server.Dockerfile') != ''
    uses: jacaudi/github-actions/.github/workflows/component-container-build.yml@v0.20.1
    permissions:
      contents: read
      packages: write
    with:
      image-name: ${{ github.repository_owner }}/diyddns-server
      dockerfile: ./packaging/docker/server.Dockerfile
      platforms: 'linux/amd64,linux/arm64'
      version: ${{ needs.release.outputs.new-release-version }}
      tags: |
        ghcr.io/${{ github.repository_owner }}/diyddns-server:${{ needs.release.outputs.new-release-version-v }}
        ghcr.io/${{ github.repository_owner }}/diyddns-server:latest

  container-client:
    name: Container - client
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true' && hashFiles('packaging/docker/client.Dockerfile') != ''
    uses: jacaudi/github-actions/.github/workflows/component-container-build.yml@v0.20.1
    permissions:
      contents: read
      packages: write
    with:
      image-name: ${{ github.repository_owner }}/diyddns-client
      dockerfile: ./packaging/docker/client.Dockerfile
      platforms: 'linux/amd64,linux/arm64'
      version: ${{ needs.release.outputs.new-release-version }}
      tags: |
        ghcr.io/${{ github.repository_owner }}/diyddns-client:${{ needs.release.outputs.new-release-version-v }}
        ghcr.io/${{ github.repository_owner }}/diyddns-client:latest

  binaries:
    name: Cross-compile native binaries
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: ""    }
          - { os: linux,   arch: arm64, ext: ""    }
          - { os: darwin,  arch: amd64, ext: ""    }
          - { os: darwin,  arch: arm64, ext: ""    }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: windows, arch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.release.outputs.new-release-version-v }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          mkdir -p dist
          LDFLAGS="-X github.com/jacaudi/diyddns/internal/version.Version=${VERSION} -X github.com/jacaudi/diyddns/internal/version.Commit=${COMMIT:0:7} -X github.com/jacaudi/diyddns/internal/version.Date=${DATE}"
          go build -ldflags "$LDFLAGS" -o dist/diyddns-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/diyddns-server
          go build -ldflags "$LDFLAGS" -o dist/diyddns-client-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/diyddns-client

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.new-release-version-v }}
          files: dist/*
