---
# Pull Request Validation
# Fast feedback on PRs: lint and test. Container builds happen on release only.
name: PR Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint Code
    uses: jacaudi/github-actions/.github/workflows/component-lint.yml@v0.20.1
    with:
      yaml: true
      go: true

  test:
    name: Run Tests
    uses: jacaudi/github-actions/.github/workflows/component-test.yml@v0.20.1
    with:
      test-framework: go
      coverage: true
