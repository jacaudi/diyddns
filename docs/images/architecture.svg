<svg viewBox="0 0 1480 680" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Architecture: a diyddns client on a Raspberry Pi 5 at a friend's house checks in over the public internet to a diyddns server running in a Kubernetes cluster on a server rack in someone's garage. The server writes to a single SQLite file, which fans out to the Web UI, Webhooks, the Feed, and a stale-address sweep.">
  <defs>
    <!-- swept arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.4 L10,5 L0,9.6 L2.9,5 Z" class="arrowhead"/>
    </marker>
    <marker id="arrow-server" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.4 L10,5 L0,9.6 L2.9,5 Z" fill="var(--server)"/>
    </marker>
    <marker id="arrow-mid" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.4 L10,5 L0,9.6 L2.9,5 Z" fill="var(--arrow)"/>
    </marker>
    <!-- the two public-internet hops carry the colour of where they come from / go to -->
    <linearGradient id="flow-out" gradientUnits="userSpaceOnUse" x1="363" y1="410" x2="487" y2="368">
      <stop offset="0" stop-color="var(--client)"/>
      <stop offset="1" stop-color="var(--arrow)"/>
    </linearGradient>
    <linearGradient id="flow-in" gradientUnits="userSpaceOnUse" x1="639" y1="310" x2="763" y2="296">
      <stop offset="0" stop-color="var(--arrow)"/>
      <stop offset="1" stop-color="var(--server)"/>
    </linearGradient>
    <clipPath id="globe-clip"><circle r="46"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <style>
      :root {
        --text: #1f2328; --muted: #57606a; --faint: #8c959f; --bg: #ffffff;
        --zone-fill: #f6f8fa; --zone-stroke: #b6bcc4;
        --box-fill: #ffffff; --box-stroke: #d0d7de;
        --client: #1a7f37; --client-fill: #e6f8ec;
        --server: #0969da; --server-fill: #eaf5ff;
        --db: #8250df; --db-fill: #f8f0ff;
        --k8s-fill: #eef2ff; --k8s-stroke: #6376e0;
        --arrow: #6e7781; --arrowhead: #6e7781;
        --icon: #6e7781;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e6edf3; --muted: #9198a1; --faint: #6e7681; --bg: #0d1117;
          --zone-fill: #161b22; --zone-stroke: #3d4450;
          --box-fill: #161b22; --box-stroke: #30363d;
          --client: #56d364; --client-fill: #10261a;
          --server: #58a6ff; --server-fill: #0c1f33;
          --db: #d2a8ff; --db-fill: #1e1329;
          --k8s-fill: #131a2e; --k8s-stroke: #5468d4;
          --arrow: #8b949e; --arrowhead: #8b949e;
          --icon: #8b949e;
        }
      }
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
      .title { font-size: 19px; font-weight: 700; }
      .sub { font-size: 12.5px; font-style: italic; fill: var(--muted); }
      .h { font-size: 14px; font-weight: 700; }
      .b { font-size: 11px; fill: var(--muted); }
      .lbl { font-size: 11px; fill: var(--muted); }
      .zone { fill: var(--zone-fill); stroke: var(--zone-stroke); stroke-width: 1.5; stroke-dasharray: 5 4; }
      .box { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
      .client-box { fill: var(--client-fill); stroke: var(--client); stroke-width: 1.75; }
      .server-box { fill: var(--server-fill); stroke: var(--server); stroke-width: 1.75; }
      .db-box { fill: var(--db-fill); stroke: var(--db); stroke-width: 1.5; }
      .k8s-zone { fill: var(--k8s-fill); stroke: var(--k8s-stroke); stroke-width: 1.5; }
      .arrow { stroke: var(--arrow); stroke-width: 1.9; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .arrowhead { fill: var(--arrowhead); }
      .flow { fill: none; stroke-width: 2.8; stroke-linecap: round; }
      .icon { fill: none; stroke: var(--icon); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="680" fill="var(--bg)"/>

  <!-- ===================== LEFT: A FRIEND'S HOUSE ===================== -->
  <rect class="zone" x="30" y="160" width="330" height="339" rx="18"/>

  <!-- house icon: clean line art. painted box x 53-83, y 182-210 -->
  <g transform="translate(52,180)" class="icon" stroke="var(--client)">
    <path d="M2,15 L16,3 L30,15"/>
    <path d="M6,13 V29 H26 V13"/>
    <path d="M13,29 V20 H19 V29"/>
  </g>
  <!-- title + subtitle share one left edge (x=108), 25px clear of the icon -->
  <text class="title" x="108" y="192">A Friend's House</text>
  <text class="sub" x="108" y="214">On a residential ISP connection</text>

  <!-- IP discovery quorum -->
  <rect class="box" x="70" y="235" width="250" height="100" rx="10" filter="url(#shadow)"/>
  <text class="h" x="90" y="262">IP Discovery Quorum</text>
  <text class="b" x="90" y="280">Asks 3 independent lookup</text>
  <text class="b" x="90" y="294">services, needs 2 of 3 to agree</text>
  <rect x="90" y="304" width="68" height="22" rx="11" class="box"/>
  <text class="b center" x="124" y="319">ident.me</text>
  <rect x="166" y="304" width="58" height="22" rx="11" class="box"/>
  <text class="b center" x="195" y="319">ipify</text>
  <rect x="232" y="304" width="76" height="22" rx="11" class="box"/>
  <text class="b center" x="270" y="319">icanhazip</text>

  <line class="arrow" x1="195" y1="335" x2="195" y2="357"/>

  <!-- Raspberry Pi board -->
  <rect class="client-box" x="70" y="359" width="250" height="126" rx="14" filter="url(#shadow)"/>
  <!-- corner mounting holes, a clean board motif -->
  <circle cx="86" cy="375" r="4" fill="none" stroke="var(--client)" stroke-width="1.75"/>
  <circle cx="304" cy="375" r="4" fill="none" stroke="var(--client)" stroke-width="1.75"/>
  <!-- raspberry mark, parked mid-right so no caption line can reach it. painted box x 269-302, y 390-426 -->
  <g transform="translate(268,389)" fill="var(--client)" stroke="none">
    <path d="M17,14.5 C 12,5.5 6,1.5 1.5,3 C 1,8.5 5.5,13 13,15 Z"/>
    <path d="M17,14.5 C 22,5.5 28,1.5 32.5,3 C 33,8.5 28.5,13 21,15 Z"/>
    <g stroke="var(--client-fill)" stroke-width="1.6">
      <circle cx="11.5" cy="19.5" r="4.5"/>
      <circle cx="22.5" cy="19.5" r="4.5"/>
      <circle cx="6.2" cy="26" r="4.5"/>
      <circle cx="17" cy="26" r="4.5"/>
      <circle cx="27.8" cy="26" r="4.5"/>
      <circle cx="11.5" cy="32.5" r="4.5"/>
      <circle cx="22.5" cy="32.5" r="4.5"/>
    </g>
  </g>

  <text class="h" x="90" y="397">diyddns-client</text>
  <text class="b" x="90" y="415">on a Raspberry Pi 5</text>
  <text class="b" x="90" y="435">HMAC-signed device secret</text>
  <text class="b" x="90" y="449">— no other credentials</text>
  <text class="lbl" x="90" y="469">checks in periodically, or on change</text>

  <!-- Arrow: the friend's house block -> the internet box (left edge) -->
  <path class="flow" stroke="url(#flow-out)" marker-end="url(#arrow-mid)" d="M363,410 C 420,442 460,404 487,368"/>

  <!-- ===================== CENTER: PUBLIC INTERNET (globe) ===================== -->
  <!-- boxed like every other node: box 487-639,264-422, centred in the 157px gap on either side -->
  <rect class="box" x="487" y="264" width="152" height="158" rx="16" filter="url(#shadow)"/>
  <g transform="translate(563,330)">
    <!-- ocean -->
    <circle r="46" fill="var(--zone-fill)" stroke="none" filter="url(#shadow)"/>
    <g clip-path="url(#globe-clip)">
      <!-- land masses -->
      <g fill="var(--icon)" fill-opacity="0.55" stroke="none">
        <!-- Greenland -->
        <path d="M-6,-37 C -1,-39 5,-36 3,-31 C 1,-28 -5,-29 -8,-33 Z"/>
        <!-- North America -->
        <path d="M-37,-30 C -29,-36 -14,-34 -9,-27 C -6,-23 -12,-20 -13,-16 C -14,-11 -11,-7 -14,-5 C -18,-3 -19,-9 -22,-13 C -27,-18 -39,-24 -37,-30 Z"/>
        <!-- South America -->
        <path d="M-16,-1 C -10,-3 -6,1 -9,7 C -12,13 -13,20 -16,27 C -18,31 -20,29 -19,23 C -18,15 -20,4 -16,-1 Z"/>
        <!-- Europe -->
        <path d="M2,-25 C 8,-28 15,-26 13,-21 C 11,-18 5,-17 2,-19 Z"/>
        <!-- Africa -->
        <path d="M0,-15 C 6,-18 16,-17 18,-12 C 20,-6 15,0 13,7 C 11,14 9,22 6,24 C 3,25 3,18 2,11 C 0,3 -4,-11 0,-15 Z"/>
        <!-- Asia -->
        <path d="M13,-29 C 24,-34 39,-30 44,-21 C 46,-15 38,-12 32,-13 C 26,-14 22,-11 18,-14 C 14,-17 10,-25 13,-29 Z"/>
        <!-- India -->
        <path d="M24,-10 C 27,-12 31,-9 28,-4 C 25,-1 22,-4 24,-9 Z"/>
        <!-- Australia -->
        <path d="M28,13 C 34,10 41,14 40,20 C 39,25 32,27 28,24 C 24,21 23,15 28,13 Z"/>
      </g>
      <!-- graticule -->
      <g fill="none" stroke="var(--icon)" stroke-opacity="0.45" stroke-width="1.1">
        <ellipse rx="18" ry="46"/>
        <ellipse rx="35" ry="46"/>
        <line x1="-46" y1="0" x2="46" y2="0"/>
        <path d="M-41,-21 C -12,-9 12,-9 41,-21"/>
        <path d="M-41,21 C -12,9 12,9 41,21"/>
      </g>
    </g>
    <circle r="46" fill="none" stroke="var(--icon)" stroke-width="1.9"/>
    <text class="h center" y="72">Public Internet</text>
  </g>
  <text class="lbl center" x="563" y="443">HMAC-signed checkin</text>
  <text class="b center" x="563" y="458">POST /agent/v1/checkin</text>

  <!-- Arrow: the internet box (right edge) -> someone's garage block -->
  <path class="flow" stroke="url(#flow-in)" marker-end="url(#arrow-server)" d="M639,310 C 700,355 725,310 763,296"/>

  <!-- ===================== RIGHT: SOMEONE'S GARAGE ===================== -->
  <rect class="zone" x="766" y="50" width="684" height="566" rx="18"/>

  <!-- server rack icon: 4 rack units, each with an LED and vent slot. painted box x 787-823, y 73-117 -->
  <g transform="translate(788,74)" class="icon" stroke="var(--server)">
    <rect x="0" y="0" width="34" height="42" rx="3.5"/>
    <line x1="0" y1="10.5" x2="34" y2="10.5"/>
    <line x1="0" y1="21" x2="34" y2="21"/>
    <line x1="0" y1="31.5" x2="34" y2="31.5"/>
    <g stroke-width="1.4">
      <line x1="14" y1="5.25" x2="27" y2="5.25"/>
      <line x1="14" y1="15.75" x2="27" y2="15.75"/>
      <line x1="14" y1="26.25" x2="27" y2="26.25"/>
      <line x1="14" y1="36.75" x2="27" y2="36.75"/>
    </g>
    <circle cx="7" cy="5.25" r="1.9" fill="var(--server)" stroke="none"/>
    <circle cx="7" cy="15.75" r="1.9" fill="var(--server)" stroke="none"/>
    <circle cx="7" cy="26.25" r="1.9" fill="var(--server)" stroke="none"/>
    <circle cx="7" cy="36.75" r="1.9" fill="var(--server)" stroke="none"/>
  </g>
  <!-- title + subtitle share one left edge (x=848), 25px clear of the icon -->
  <text class="title" x="848" y="91">Someone's Garage</text>
  <text class="sub" x="848" y="115">A small Kubernetes cluster</text>

  <!-- k8s inner zone: visually distinct, not just a nested dashed twin -->
  <rect class="k8s-zone" x="786" y="136" width="644" height="460" rx="14"/>
  <!-- Kubernetes helm mark: 26-unit design scaled to 30. painted box x 802-832, y 150-180 -->
  <g transform="translate(802,150) scale(1.154)">
    <polygon points="13.00,0.40 22.85,5.14 25.28,15.80 18.47,24.35 7.53,24.35 0.72,15.80 3.15,5.14" fill="var(--k8s-stroke)"/>
    <g fill="var(--k8s-fill)">
      <polygon points="14.15,9.01 14.95,2.92 11.05,2.92 11.85,9.01"/>
      <polygon points="16.84,11.41 22.10,8.24 19.67,5.19 15.40,9.61"/>
      <polygon points="16.63,15.01 22.39,17.14 23.26,13.34 17.15,12.77"/>
      <polygon points="13.70,17.09 15.62,22.93 19.13,21.24 15.77,16.10"/>
      <polygon points="10.23,16.10 6.87,21.24 10.38,22.93 12.30,17.09"/>
      <polygon points="8.85,12.77 2.74,13.34 3.61,17.14 9.37,15.01"/>
      <polygon points="10.60,9.61 6.33,5.19 3.90,8.24 9.16,11.41"/>
    </g>
    <polygon points="13.00,8.80 16.28,10.38 17.09,13.93 14.82,16.78 11.18,16.78 8.91,13.93 9.72,10.38"
             fill="none" stroke="var(--k8s-fill)" stroke-width="1.5"/>
  </g>
  <text class="h" x="856" y="170" fill="var(--k8s-stroke)">Kubernetes Cluster</text>

  <!-- server pod -->
  <rect class="server-box" x="918" y="186" width="380" height="76" rx="10" filter="url(#shadow)"/>
  <text class="h center" x="1108" y="212">diyddns-server</text>
  <text class="b center" x="1108" y="230">Deployment · replicas: 1</text>
  <text class="b center" x="1108" y="246">strategy: Recreate — single SQLite writer</text>

  <line class="arrow" x1="1108" y1="262" x2="1108" y2="282"/>

  <!-- SQLite cylinder -->
  <g transform="translate(958,282)" filter="url(#shadow)">
    <!-- body: sides + the bottom cap only. The far edge of the bottom ellipse stays hidden,
         so the label sits in a face that runs 24 -> 98 local, centred on local 58. -->
    <path class="db-box" d="M0,12 L0,86 A150,12 0 0 0 300,86 L300,12 Z"/>
    <ellipse cx="150" cy="12" rx="150" ry="12" class="db-box"/>
  </g>
  <text class="h center" x="1108" y="337">SQLite — one file</text>
  <text class="b center" x="1108" y="354">devices · ip_history · audit_log</text>

  <!-- bus: db -> single row of four, each with its own glyph -->
  <!-- distribution manifold: one trunk off the file, rounded elbows, a vertical drop per consumer -->
  <g class="arrow">
    <path d="M1108,384 V400 Q1108,412 1096,412 H883 Q871,412 871,424 V446"/>
    <path d="M1108,384 V400 Q1108,412 1096,412 H1041 Q1029,412 1029,424 V446"/>
    <path d="M1108,384 V400 Q1108,412 1120,412 H1175 Q1187,412 1187,424 V446"/>
    <path d="M1108,384 V400 Q1108,412 1120,412 H1333 Q1345,412 1345,424 V446"/>
  </g>

  <!-- fan-out: one row of four, each with a small glyph -->
  <rect class="box" x="799" y="452" width="144" height="130" rx="10" filter="url(#shadow)"/>
  <g transform="translate(814,462)" class="icon" stroke="var(--server)">
    <rect x="0" y="0" width="22" height="17" rx="2.5"/>
    <line x1="0" y1="5" x2="22" y2="5"/>
  </g>
  <text class="h" x="814" y="502">Web UI</text>
  <text class="b" x="814" y="520">passkey / OIDC</text>
  <text class="b" x="814" y="534">sessions</text>
  <text class="lbl" x="814" y="553">→ you,</text>
  <text class="lbl" x="814" y="567">in a browser</text>

  <rect class="box" x="957" y="452" width="144" height="130" rx="10" filter="url(#shadow)"/>
  <g transform="translate(972,462)" class="icon" stroke="var(--server)">
    <circle cx="4" cy="14" r="4"/>
    <circle cx="18" cy="5" r="4"/>
    <line x1="7" y1="12" x2="15" y2="7"/>
  </g>
  <text class="h" x="972" y="502">Webhooks</text>
  <text class="b" x="972" y="520">signed HTTP,</text>
  <text class="b" x="972" y="534">per event</text>
  <text class="lbl" x="972" y="553">→ your</text>
  <text class="lbl" x="972" y="567">automation</text>

  <rect class="box" x="1115" y="452" width="144" height="130" rx="10" filter="url(#shadow)"/>
  <g transform="translate(1130,460)" class="icon" stroke="var(--server)">
    <circle cx="7" cy="15" r="2.2" fill="var(--server)" stroke="none"/>
    <path d="M3,11 a 8,8 0 0 1 8,0" fill="none"/>
    <path d="M0,6 a 14,14 0 0 1 14,0" fill="none"/>
  </g>
  <text class="h" x="1130" y="502">Feed</text>
  <text class="b" x="1130" y="520">REST poll +</text>
  <text class="b" x="1130" y="534">WS stream</text>
  <text class="lbl" x="1130" y="553">→ gateway</text>
  <text class="lbl" x="1130" y="567">allow-list</text>

  <rect class="box" x="1273" y="452" width="144" height="130" rx="10" filter="url(#shadow)"/>
  <g transform="translate(1288,462)" class="icon" stroke="var(--server)">
    <circle cx="9" cy="9" r="9"/>
    <path d="M9,3.5 V9 L13.5,12"/>
  </g>
  <text class="h" x="1288" y="502">Stale Sweep</text>
  <text class="b" x="1288" y="520">expires addresses</text>
  <text class="b" x="1288" y="534">left unconfirmed</text>
  <text class="lbl" x="1288" y="553">→ owner email,</text>
  <text class="lbl" x="1288" y="567">then removal</text>

  <text class="sub center" x="740" y="650">One SQLite file is the whole source of truth — every feature above reads or writes it, nothing is cached elsewhere.</text>
</svg>
