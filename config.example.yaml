# DIYDDNS server — example configuration.
#
# Copy to config.yaml and run:
#
#     diyddns-server serve --config config.yaml
#
# Every key below is optional EXCEPT the two marked REQUIRED. Anything you
# omit falls back to the default shown in its comment (the defaults are
# defined in internal/config/config.go, keyDefaults).
#
# Precedence, highest first:
#
#     command-line flag  >  DIYDDNS_* env var  >  this file  >  built-in default
#
# Env var names are the dotted key upper-cased with dots replaced by
# underscores, prefixed DIYDDNS_ — e.g. auth.hmac.secret_key is
# DIYDDNS_AUTH_HMAC_SECRET_KEY. Binding is explicit, not automatic; the two
# exceptions and one unsupported key are called out inline below.
#
# There is no ${file:...} or ${env:...} indirection — values are read
# literally. To keep a secret out of this file, set its env var instead.

server:
  # HTTP listen address. Default ":8080". Also settable via `--listen`.
  # The server speaks plain HTTP only — there is no TLS listener. Terminate
  # TLS at a reverse proxy in front of it.
  listen: "127.0.0.1:8080"

  # Public base URL of this server. Default "" (unset). REQUIRED when
  # auth.oidc.enabled is true, where it forms the OIDC redirect_uri.
  #
  # Also embedded in every copy-paste artifact the web UI renders: admin
  # invite links, passkey-recovery links, and the `diyddns-client enroll
  # --code` command shown after minting an enrollment code. Where it is
  # unset the web UI derives a best-effort value from the incoming request,
  # which can be wrong behind a reverse proxy, and says so on the page.
  #
  # But leaving it unset is NOT generally an option: auth.webauthn.rp_id and
  # rp_origin are derived from it, so with all three empty the server refuses
  # to start ("auth.webauthn.rp_id/rp_origin not set and server.base_url is
  # empty"). The request-derived fallback is therefore reachable only when
  # auth.webauthn.rp_id AND rp_origin are set explicitly — or when
  # auth.hide_local_login_ui is true, which turns passkey login off entirely.
  # In every other configuration base_url is required.
  base_url: "http://localhost:8080"

database:
  # REQUIRED. Path to the SQLite database file; it is created on first run
  # along with its schema. The server refuses to start without it
  # ("config: database.path is required").
  path: "/var/lib/diyddns/diyddns.db"

logging:
  level: "info" # debug | info | warn | error. Default "info".
  format: "json" # json | text. Default "json".
  # stderr | stdout | a file path (opened append-only, mode 0600).
  # Default "stderr".
  output: "stderr"

auth:
  hmac:
    # REQUIRED in practice. Base64 of exactly 32 random bytes; it is the AEAD
    # master key that seals device secrets and enrollment codes. Config load
    # tolerates an empty value, but the server then FAILS CLOSED at startup:
    # "server: config: auth.hmac.secret_key must decode to 32 bytes, got 0".
    #
    # Generate one with:
    #
    #     head -c 32 /dev/urandom | base64
    #
    # Rotating this key invalidates every enrolled device. Prefer supplying it
    # via DIYDDNS_AUTH_HMAC_SECRET_KEY rather than committing it here.
    secret_key: "REPLACE_ME_WITH_BASE64_OF_32_RANDOM_BYTES"

    # How far an agent's signed request timestamp may drift from server time.
    # Default "120s".
    skew_window: "120s"
    # How long a used request nonce is remembered for replay rejection.
    # Default "120s". MUST be >= skew_window or startup fails.
    nonce_ttl: "120s"

  session:
    # Browser session cookie name. Default "diyddns_session".
    cookie_name: "diyddns_session"

    # Default TRUE. GOTCHA: the session cookie is emitted with the Secure
    # attribute whenever the request arrived over TLS *or* this is true
    # (internal/server/api/auth.go, sessionCookie), so a plain-HTTP server
    # still sets Secure by default. Browsers treat http://localhost and
    # http://127.0.0.1 as trustworthy origins and will store it, so local
    # testing works — but a browser pointed at http://<lan-ip>:PORT will
    # SILENTLY DISCARD the session cookie and every login will appear to
    # fail. If you are testing off-box over plain HTTP, set this to false;
    # otherwise put TLS in front and leave it true.
    #
    # The same rule governs the WebAuthn ceremony cookies
    # (internal/server/api/passkey.go, passkeyChallengeCookie), and it has one
    # more consequence for NON-BROWSER clients: a scripted HTTP client talking
    # plain HTTP to a cookie_secure: true deployment must implement the
    # localhost secure-context exemption itself, or it will store these cookies
    # and never send them — and the ceremony then fails with an opaque 401.
    # Go's own net/http/cookiejar only gained that exemption in Go 1.26. If you
    # script against this server over plain HTTP, either wrap your cookie jar or
    # set this to false for that environment.
    cookie_secure: true

    # Default "lax". NOTE: currently inert — sessionCookie hardcodes
    # SameSite=Lax. The value is only echoed back by the admin config
    # endpoint. Left here because it is a real config key; do not expect
    # changing it to change the cookie.
    cookie_samesite: "lax"

    # Absolute session lifetime. Default "720h" (30 days).
    ttl: "720h"
    # Sliding-renewal window: activity within this window extends the
    # session. Default "168h" (7 days).
    slide_window: "168h"

  # NOTE: there is no auth.password or auth.bootstrap section. Local password
  # authentication was removed in favour of multi-passkey WebAuthn, and with it
  # the env-provisioned bootstrap admin. The first admin is now claimed through
  # a passkey ceremony:
  #
  #   1. Start the server. It mints a single-use token and logs
  #        BOOTSTRAP_TOKEN=<token> claim the first admin at /register ...
  #      The plaintext is printed exactly once and cannot be reprinted.
  #   2. Open /register in a browser, enter the token AND an admin email
  #      (the email is what selects first-run setup over an invite redeem),
  #      and register a passkey.
  #
  # This cannot be driven by curl: a WebAuthn ceremony needs an authenticator
  # to sign a challenge. See internal/smoke for a scripted equivalent.

  webauthn:
    # Relying Party ID and origin. Both default to being derived from
    # server.base_url, which is the recommended setup — leave them empty.
    #
    # GOTCHA: the RP ID MUST be a domain name. An IP address is not a valid
    # RP ID under the WebAuthn spec and every browser rejects it, reporting
    # only a generic "SecurityError: The operation is insecure" that names
    # neither the RP ID nor the address. The server now refuses to start in
    # that configuration rather than let it fail in the browser.
    #
    # So: use http://localhost:8080, NOT http://127.0.0.1:8080. They are the
    # same machine but 127.0.0.1 is a trustworthy *origin* and not a valid
    # *RP ID* — the two are not interchangeable here.
    #
    # The browser's address bar must also match the RP ID: browsing to
    # 127.0.0.1 while the RP ID is "localhost" fails with an origin mismatch.
    rp_id: ""
    rp_origin: ""

    # Shown in the browser's passkey prompt. Default "DIYDDNS".
    rp_display_name: "DIYDDNS"

    # How long a ceremony may stay open. Default "120s".
    timeout: "120s"

  # Default false. When true the passkey block is omitted from /login, leaving
  # OIDC as the only offered path. The /login route still responds.
  hide_local_login_ui: false


  oidc:
    # Single-provider OpenID Connect. Default false (disabled). When enabled,
    # issuer + client_id + client_secret + server.base_url are all REQUIRED
    # and startup fails without them.
    enabled: false

    # Fail closed: when true, a failed discovery at startup aborts the
    # server instead of retrying in the background. Default false.
    required: false

    issuer: "" # e.g. "https://idp.example.com"
    client_id: ""
    # Prefer DIYDDNS_AUTH_OIDC_CLIENT_SECRET; never logged.
    client_secret: ""

    # Default ["openid", "profile", "email"]. MUST include "openid".
    # This is the one key with NO env-var support — viper delivers env values
    # as a single string, so DIYDDNS_AUTH_OIDC_SCOPES is ignored. Set it here.
    scopes: ["openid", "profile", "email"]

    # Link an OIDC identity to an existing local account with the same
    # verified email. Default true.
    auto_link_by_email: true
    # Allow a brand-new account to be created on first OIDC login.
    # Default true.
    allow_oidc_signup: true

# Outbound account email. Used for passkey recovery links and for the invite and
# recovery links an admin issues from the Users screen. Disabled by default:
# when off, those links are shown once on screen for manual delivery, which is
# the correct behaviour for an air-gapped or SMTP-less deployment.
#
# Enabling this REQUIRES server.base_url, because emailed links must be
# absolute — the server refuses to start otherwise.
email:
  enabled: false
  host: "" # e.g. "smtp.example.com"
  # 587 for starttls, 465 for implicit, 25 for none.
  port: 587
  # Leave username empty to skip SMTP AUTH entirely. A non-empty username with
  # tls: none is REJECTED at startup for any host other than localhost/
  # 127.0.0.1/::1 — net/smtp refuses to send credentials over an unencrypted
  # connection.
  username: ""
  # Prefer DIYDDNS_EMAIL_PASSWORD; never logged.
  password: ""
  from: "" # e.g. "diyddns@example.com"
  # One of: starttls (default), implicit, none. Any other value is rejected at
  # startup. NOTE: none + a non-empty username above is also rejected at
  # startup unless host is localhost/127.0.0.1/::1 (see username, above).
  tls: "starttls"

# Outbound IP-change webhook (#65). Notifies operator-configured endpoints when
# a device's public IP changes. Validation runs unconditionally at startup —
# even while disabled — so a misconfigured policy fails at boot rather than at
# switch-on.
notifications:
  # Default false. Left live (unlike its four siblings below) because a
  # null-valued `notifications:` section — every child commented out, so YAML
  # parses it as a bare nil value rather than a mapping — confuses viper's env
  # binding. The mechanism (measured against viper v1.21.0, NOT map-iteration
  # order in config.Load, which changes nothing when made deterministic): a
  # nil-valued section puts the BARE key "notifications" into AllKeys() via
  # flattenAndMergeMap's default branch; find() then resolves that bare key to
  # the *entire defaults sub-map*, because nested==false skips the
  # config-shadow check that would otherwise stop it; and getSettings()
  # iterates AllKeys() in Go map order, so if the bare key lands after this
  # section's dotted child keys, its resolved sub-map overwrites the env-
  # derived values already written for them. config.Load itself now detects
  # and rejects this shape at startup (any top-level section with no live
  # child fails loud, naming the section) — this comment just explains why an
  # operator would ever hit that error by commenting out every key below.
  # Every other top-level section already has at least one live child for the
  # same reason; keep it that way.
  enabled: false

  # Operator-only allowlist of private/internal CIDR prefixes a notification
  # endpoint URL is permitted to resolve into. Default [] (empty): no private
  # destinations are allowed, so an endpoint pointing at an internal address is
  # rejected at send time. Comma-separated when set via
  # DIYDDNS_NOTIFICATIONS_ALLOWED_PRIVATE_CIDRS.
  # allowed_private_cidrs: []

  # Per-attempt HTTP timeout. Default "10s".
  # timeout: 10s

  # Maximum delivery attempts (with doubling backoff) before giving up.
  # Default 8. Must be 1..16 — beyond that the backoff can overflow.
  # max_attempts: 8

  # Maximum notification endpoints a single user may configure. Default 5.
  # max_endpoints_per_user: 5
# Data retention for ip_history and audit_log. Disabled by default: neither
# table loses a row to this policy until you set one of the three keys below,
# so upgrading DIYDDNS never destroys history you already have because of
# retention.
#
# NOTE: separately and unconditionally, every sweep also deletes expired
# single-use tokens (account_recovery_tokens, enrollment_codes) once they
# expire, whether or not they were used. This is NOT gated by the keys below
# and starts on the first hourly sweep after upgrade. The audit trail is
# unaffected (device.enroll.code and passkey.recovery_issued events survive);
# what is lost is the token rows themselves, including
# enrollment_codes.device_id.
#
# Deletion is PERMANENT and there is no undo. When you first enable a key, the
# next sweep removes everything already outside the window. That work is done in
# batches so it cannot monopolise the database, but on a long-lived deployment
# it can still be a lot of rows the first time.
#
# The most recent ip_history row for each device is ALWAYS kept, whatever you
# set here. The sweep runs hourly and is not configurable.
retention:
  # Delete ip_history rows older than this many days. Default 0 (keep forever).
  # Maximum 36500 (100 years).
  ip_history_days: 0

  # Keep at most this many ip_history rows per device. Default 0 (unlimited).
  # Maximum 36500.
  ip_history_per_device_max: 0

  # Delete audit_log rows older than this many days. Default 0 (keep forever).
  # Maximum 36500 (100 years).
  audit_log_days: 0
