# Cross-cutting repo checks; each is a no-op when its subject is absent. Rationale: github-actions-align/templates/README.md#repoyml
version: '3'

tasks:
  ci:
    desc: All repo-level checks
    cmds:
      - task: actions
      - task: yaml
      - task: docker
      - task: helm
      - task: html
      - task: css

  actions:
    desc: Lint GitHub Actions workflows (only when they changed)
    cmds:
      - task: actions:local-refs
      - |
        set -eu
        [ -d .github/workflows ] || { echo "no workflows — skipping actionlint"; exit 0; }
        base="${BASE_REF:-HEAD~1}"
        if git rev-parse --verify --quiet "${base}" >/dev/null; then
          if [ -z "$(git diff --name-only "${base}" HEAD -- .github/workflows)" ]; then
            echo "no workflow changes since ${base} — skipping actionlint"
            exit 0
          fi
        fi
        command -v actionlint >/dev/null \
          || { echo "actionlint not installed: go install github.com/rhysd/actionlint/cmd/actionlint@latest" >&2; exit 1; }
        actionlint

  actions:local-refs:
    desc: "Assert every local `uses:` reference actually exists"
    cmds:
      # `find -print0 | xargs -0` and NOT a bare `*.yml *.yaml` glob pair: when one
      # glob has no match, awk dies on the literal argument, 2>/dev/null hides it,
      # and the pipe swallows the status — so an all-.yaml repo silently passed.
      - |
        set -eu
        [ -d .github/workflows ] || exit 0
        files=$(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))
        [ -n "${files}" ] || { echo "no workflow files — nothing to check"; exit 0; }
        fail=0
        # shellcheck disable=SC2086  # deliberate word split over the file list
        refs=$(awk '/uses:[[:space:]]*\.\//{
                 sub(/.*uses:[[:space:]]*/,""); sub(/[[:space:]]*#.*/,""); sub(/[[:space:]]*$/,""); print
               }' ${files} | sort -u)
        for ref in ${refs}; do
          case "${ref}" in
            *.yml|*.yaml)
              [ -f "${ref#./}" ] || { echo "MISSING workflow: ${ref}"; fail=1; } ;;
            *)
              d="${ref#./}"
              if [ ! -f "${d}/action.yml" ] && [ ! -f "${d}/action.yaml" ]; then
                echo "MISSING action:   ${ref} (no action.yml)"; fail=1
              fi ;;
          esac
        done
        [ "${fail}" = "0" ] || { echo "::error::a local uses: reference points at nothing"; exit 1; }
        echo "local uses: references ok"

  yaml:
    desc: yamllint, when a config is present
    cmds:
      # yamllint, NOT `uvx yamllint` — yamllint ships on the runner and uv does not.
      - |
        set -eu
        if [ ! -f .yamllint.yml ] && [ ! -f .yamllint.yaml ]; then
          echo "no .yamllint config — skipping"; exit 0
        fi
        command -v yamllint >/dev/null \
          || { echo "yamllint not installed: uv tool install yamllint" >&2; exit 1; }
        yamllint .

  docker:
    desc: hadolint every Dockerfile
    cmds:
      - |
        set -eu
        files=$(find . -name 'Dockerfile*' -not -path './.git/*' -not -path './.claude/*' -not -path '*/node_modules/*' -not -path '*/vendor/*')
        [ -n "${files}" ] || { echo "no Dockerfile — skipping hadolint"; exit 0; }
        command -v hadolint >/dev/null \
          || { echo "hadolint not installed: brew install hadolint" >&2; exit 1; }
        echo "${files}" | xargs hadolint

  html:
    desc: "No inline style= attribute in an HTML template"
    cmds:
      # Every width, margin and display the UI uses lives in app.css, where one
      # rule can cover every spelling of a pattern at once. An inline style is
      # invisible to that file: the templates carried max-width:560/640/680px
      # and margin-bottom:var(--space-5) in style attributes, so three pages
      # picked three widths for two kinds of card and no rule could see it.
      # The stylesheet's scales are enforced by comment alone; this is the one
      # place a bypass fails the build.
      - |
        set -eu
        files=$(find . -name '*.html' -not -path './.git/*' -not -path './.claude/*' -not -path '*/node_modules/*' -not -path '*/vendor/*')
        [ -n "${files}" ] || { echo "no HTML templates — skipping"; exit 0; }
        # shellcheck disable=SC2086  # deliberate word split over the file list
        hits=$(grep -nE '(^|[[:space:]])style=' ${files} || true)
        if [ -n "${hits}" ]; then
          echo "${hits}"
          echo "::error::inline style= in a template — add a class to internal/server/webui/static/app.css instead (component inventory at the top of that file)"
          exit 1
        fi
        echo "html: no inline styles"

  css:
    desc: "No off-scale px in a stylesheet's spacing or font-size declarations"
    cmds:
      # app.css declares --space-N as the only source of margin/padding/gap and
      # --type-N as the only source of font-size; both were enforced by comment
      # alone. Comments are stripped first — replaced by the same number of
      # newlines, so the reported line is the real one — because the file's
      # comments quote pixel values constantly. Scope is exactly the two scales'
      # own domains: widths, radii, borders, shadows, heights and media queries
      # are on no scale and are not checked, since a rule that flags them is one
      # people learn to ignore. The one exemption is the one the type-scale
      # comment names: .empty .icon sizes a decorative emoji, not text.
      - |
        set -eu
        files=$(find . -name '*.css' -not -path './.git/*' -not -path './.claude/*' -not -path '*/node_modules/*' -not -path '*/vendor/*')
        [ -n "${files}" ] || { echo "no stylesheets — skipping"; exit 0; }
        command -v perl >/dev/null || { echo "perl not installed" >&2; exit 1; }
        fail=0
        for f in ${files}; do
          hits=$(perl -0pe 's{/\*(.*?)\*/}{"\n" x ($1 =~ tr/\n//)}gse' "${f}" \
            | grep -nE '(margin|padding|gap|font-size)[a-z-]*[[:space:]]*:[^;{}]*[0-9.]+px' \
            | grep -v '^[0-9]*:\.empty \.icon ' || true)
          [ -z "${hits}" ] || { echo "${hits}" | sed "s|^|${f}:|"; fail=1; }
        done
        [ "${fail}" = "0" ] || { echo "::error::a spacing or font-size value is off the scale — use var(--space-N) / var(--type-N), or add a step and document it"; exit 1; }
        echo "css: spacing and type on scale"

  chart:deps:
    desc: Register classic dependency repos and build chart dependencies
    cmds:
      # Single source of truth for dependency resolution — ci-chart.yml calls this
      # too. Without it `helm template` fails once the vendored .tgz is deleted, as
      # the migration instructs.
      - |
        set -eu
        for c in $(find . -name Chart.yaml -not -path './.git/*' -not -path '*/charts/*'); do
          d=$(dirname "${c}")
          count=$(yq '.dependencies | length // 0' "${c}")
          [ "${count}" -gt 0 ] || continue
          i=0
          while [ "${i}" -lt "${count}" ]; do
            name=$(yq ".dependencies[${i}].name" "${c}")
            repo=$(yq ".dependencies[${i}].repository" "${c}")
            case "${repo}" in
              oci://*|""|null) : ;;
              *) echo "helm repo add ${name} ${repo}"; helm repo add "${name}" "${repo}" >/dev/null ;;
            esac
            i=$((i + 1))
          done
          echo "helm dependency build ${d}"
          helm dependency build "${d}"   # build, NOT update — honours Chart.lock
        done

  helm:
    desc: helm lint + template, when a chart is present
    cmds:
      - task: chart:deps
      - |
        set -eu
        charts=$(find . -name Chart.yaml -not -path './.git/*' -not -path '*/charts/*')
        [ -n "${charts}" ] || { echo "no chart — skipping helm lint"; exit 0; }
        command -v helm >/dev/null \
          || { echo "helm not installed: brew install helm" >&2; exit 1; }
        for c in ${charts}; do
          d=$(dirname "${c}")
          echo "linting ${d}"
          helm lint "${d}"
          helm template release-test "${d}" >/dev/null
        done
