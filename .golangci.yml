# Fleet baseline, golangci-lint v2 schema. A floor, not a ceiling. Rationale: github-actions-align/templates/README.md#golangciyml
version: "2"

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true
  # Without this, no //go:build smoke or //go:build browser file is ever linted
  # (issue #79) — an entire package's worth of test code sat outside the gate.
  #
  # BOTH tags must be listed TOGETHER, in one build configuration. golangci-lint
  # v2.12.2 does not run a per-tag matrix, and that is load-bearing here:
  # helpers_test.go is `//go:build smoke || browser` but its helpers are called
  # only from the smoke-tagged files, so linting `browser` ALONE reports them as
  # unused. Do not "improve" this into one run per tag. (Observed for v2.12.2 on
  # 2026-08-19; not a documented upstream guarantee, so re-measure before
  # changing it.)
  #
  # Formatters need no tags — `golangci-lint fmt` has no --build-tags flag and
  # is syntactic. Verified: a deliberate misformat in a smoke-tagged file is
  # caught by `golangci-lint fmt --diff` with no tags set. #79 is a
  # linters-only gap; do not touch fmt:check.
  build-tags:
    - smoke
    - browser

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
        - name: error-return
        - name: error-naming
        - name: indent-error-flow
        - name: unexported-return
        - name: comment-spacings
        - name: import-shadowing
    gocyclo:
      min-complexity: 15
    errorlint:
      asserts: true
      comparison: true
      errorf: true
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G104  # errcheck covers unhandled errors, and better

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gocyclo, dupl, gosec, errcheck, unparam, prealloc]
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # MIGRATION RATCHET — uncomment when adopting this baseline on code that
  # predates it. Reports only issues in code changed since the merge base, so the
  # standard applies going forward without blocking the migration on existing
  # debt. Valid in the v2 schema.
  #
  # Measure before deciding: a repo with no prior lint config can surface well
  # over a hundred findings, and `golangci-lint run --fix` resolves NONE of them
  # (tested). See the full debt any time with:
  #   golangci-lint run --new-from-merge-base=""
  # new-from-merge-base: origin/main

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
