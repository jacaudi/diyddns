{{define "content"}}
<div class="card auth-card">
  <h1>Sign in</h1>
  {{if .ShowPasskey}}
  <button id="passkey-login" type="button" class="btn primary block">Sign in with a passkey</button>
  <p id="passkey-login-status" class="status" role="status" aria-live="polite"></p>
  {{end}}
  {{if .ShowOIDC}}
  <a class="btn block" href="/api/v1/auth/oidc/start">Sign in with your provider</a>
  {{end}}
  {{if .ShowRecover}}
  <p class="muted center"><a href="#" id="recover-toggle">Lost your passkey?</a></p>
  <form id="recover-form" hidden method="post" action="/api/v1/auth/recovery/request">
    <input type="hidden" name="csrf" value="{{.CSRFToken}}">
    <div class="field">
      <label for="recover-email">Email</label>
      <input class="input" id="recover-email" name="email" type="email" autocomplete="email" required>
    </div>
    <button class="btn block" type="submit">Send recovery link</button>
  </form>
  <p id="recover-status" class="status" role="status" aria-live="polite"></p>
  {{end}}
</div>
{{end}}
